<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FishMaster Planner TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Используем переменные темы Telegram */
            --tg-bg: var(--tg-theme-bg-color, #0f172a);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #94a3b8);
            --tg-link: var(--tg-theme-link-color, #00f2fe);
            --tg-button: var(--tg-theme-button-color, #4facfe);
            --tg-button-text: var(--tg-theme-button-text-color, #0f172a);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.05));
            
            --p-color: #4ade80;
            --h-color: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--tg-bg);
            color: var(--tg-text);
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 1.5rem;
            text-align: center;
            background: linear-gradient(to right, var(--tg-link), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .selector-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--tg-hint);
            margin: 12px 0 8px;
            display: block;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-container::-webkit-scrollbar { display: none; }

        .pill {
            padding: 12px 16px;
            background: var(--tg-secondary-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            text-align: center;
            flex-shrink: 0;
            color: var(--tg-text);
        }

        .pill.active {
            background: var(--tg-button);
            color: var(--tg-button-text);
            font-weight: 700;
            border-color: var(--tg-button);
        }

        .location-info {
            background: var(--tg-secondary-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--tg-secondary-bg);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card i { color: var(--tg-link); font-size: 0.9rem; margin-bottom: 4px; }
        .stat-card div { font-weight: 700; font-size: 1rem; }
        .stat-card span { font-size: 0.6rem; color: var(--tg-hint); display: block; }

        .fish-box {
            background: var(--tg-secondary-bg);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .fish-box .percent { font-size: 2.2rem; font-weight: 800; margin: 8px 0; }
        .logs { text-align: left; font-size: 0.75rem; color: var(--tg-hint); list-style: none; }
        .logs li { margin-top: 4px; display: flex; gap: 6px; align-items: flex-start; }

        .btn-main {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: var(--tg-button);
            color: var(--tg-button-text);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 16px;
        }

        #app { display: none; }
        .loading { display: none; text-align: center; padding: 40px; color: var(--tg-link); }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>FISHTIME TMA</h1>
        </header>

        <button class="btn-main" id="btnStart">РАСЧИТАТЬ ПРОГНОЗ КЛЕВА</button>

        <div class="loading" id="loader">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top:10px">Анализируем водоем...</p>
        </div>

        <div id="app">
            <div class="location-info">
                <i class="fa-solid fa-location-arrow" id="locIcon"></i>
                <div>
                    <div id="cityName" style="font-weight: 700; font-size: 0.9rem;">Определяем место...</div>
                    <div id="geoCoords" style="font-size: 0.7rem; color: var(--tg-hint);">Координаты...</div>
                </div>
            </div>

            <span class="selector-label">День:</span>
            <div class="scroll-container" id="datePicker"></div>

            <span class="selector-label">Окно времени:</span>
            <div class="scroll-container" id="timePicker"></div>

            <div class="grid-stats">
                <div class="stat-card"><i class="fa-solid fa-temp-half"></i><div id="tVal">--</div><span>ТЕМП.</span></div>
                <div class="stat-card"><i class="fa-solid fa-gauge"></i><div id="pVal">--</div><span>ДАВЛ.</span></div>
                <div class="stat-card"><i class="fa-solid fa-wind"></i><div id="wVal">--</div><span>ВЕТЕР</span></div>
            </div>

            <div class="fish-box" style="border-left: 4px solid var(--p-color)">
                <h3 style="color: var(--p-color); font-size: 0.8rem;">МИРНАЯ РЫБА</h3>
                <div class="percent" id="percP" style="color: var(--p-color)">0%</div>
                <ul class="logs" id="logsP"></ul>
            </div>

            <div class="fish-box" style="border-left: 4px solid var(--h-color)">
                <h3 style="color: var(--h-color); font-size: 0.8rem;">ХИЩНАЯ РЫБА</h3>
                <div class="percent" id="percH" style="color: var(--h-color)">0%</div>
                <ul class="logs" id="logsH"></ul>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран
        tg.ready();

        let weather = null;
        let activeDay = 0;
        let activeHourStart = 9;

        const intervals = [
            { label: "00:00 - 03:00", start: 0 },
            { label: "03:00 - 06:00", start: 3 },
            { label: "06:00 - 09:00", start: 6 },
            { label: "09:00 - 12:00", start: 9 },
            { label: "12:00 - 15:00", start: 12 },
            { label: "15:00 - 18:00", start: 15 },
            { label: "18:00 - 21:00", start: 18 },
            { label: "21:00 - 00:00", start: 21 }
        ];

        document.getElementById('btnStart').onclick = function() {
            this.style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // Telegram поддерживает нативный запрос геопозиции, но мы используем браузерный для простоты
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                document.getElementById('geoCoords').textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                try {
                    const g = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                    const gData = await g.json();
                    document.getElementById('cityName').textContent = gData.address.city || gData.address.town || gData.address.village || "Точка на карте";

                    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,surface_pressure,wind_speed_10m,precipitation&timezone=auto`);
                    weather = await wRes.json();

                    initUI();
                    tg.HapticFeedback.notificationOccurred('success'); // Виброотклик
                } catch (e) { 
                    alert("Ошибка данных");
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }, () => {
                alert("Пожалуйста, разрешите доступ к геолокации в настройках Telegram");
            });
        };

        function initUI() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';

            const datePicker = document.getElementById('datePicker');
            const now = new Date();
            for(let i=0; i<7; i++) {
                const d = new Date();
                d.setDate(now.getDate() + i);
                const pill = document.createElement('div');
                pill.className = `pill ${i===0?'active':''}`;
                pill.innerHTML = `<div style="font-size:0.7rem">${d.toLocaleDateString('ru-RU', {weekday:'short'})}</div><div>${d.getDate()}</div>`;
                pill.onclick = () => {
                    document.querySelectorAll('#datePicker .pill').forEach(p=>p.classList.remove('active'));
                    pill.classList.add('active');
                    activeDay = i;
                    calculate();
                    tg.HapticFeedback.impactOccurred('light');
                };
                datePicker.appendChild(pill);
            }

            const timePicker = document.getElementById('timePicker');
            intervals.forEach(inv => {
                const pill = document.createElement('div');
                pill.className = `pill ${inv.start === 9 ? 'active' : ''}`;
                pill.textContent = inv.label;
                pill.onclick = () => {
                    document.querySelectorAll('#timePicker .pill').forEach(p=>p.classList.remove('active'));
                    pill.classList.add('active');
                    activeHourStart = inv.start;
                    calculate();
                    tg.HapticFeedback.impactOccurred('light');
                };
                timePicker.appendChild(pill);
            });
            calculate();
        }

        function calculate() {
            const idx = (activeDay * 24) + activeHourStart;
            const h = weather.hourly;

            document.getElementById('tVal').textContent = Math.round(h.temperature_2m[idx]) + '°';
            document.getElementById('pVal').textContent = Math.round(h.surface_pressure[idx]);
            document.getElementById('wVal').textContent = Math.round(h.wind_speed_10m[idx]) + ' км/ч';

            const calcFish = (isPredator) => {
                let s = 55;
                let log = [];
                const press = h.surface_pressure[idx];
                const prev = idx > 0 ? h.surface_pressure[idx-3] : press;
                const diff = press - prev;

                if (Math.abs(diff) < 1) { s += 20; log.push("Стабильное давление"); }
                else if (diff < -2) {
                    if(isPredator) { s += 30; log.push("Давление падает — хищник активен"); }
                    else { s -= 20; log.push("Рыба болеет от перепада"); }
                }

                const t = h.temperature_2m[idx];
                if (t > 22 && !isPredator) { s += 10; log.push("Вода прогрета"); }
                if (t < 16 && isPredator) { s += 15; log.push("Хорошая прохлада для щуки"); }

                if (h.precipitation[idx] > 0) { s += 10; log.push("Осадки насыщают воду"); }

                return { s: Math.max(5, Math.min(99, s)), log };
            };

            const p = calcFish(false);
            const pr = calcFish(true);

            document.getElementById('percP').textContent = p.s + '%';
            document.getElementById('percH').textContent = pr.s + '%';
            document.getElementById('logsP').innerHTML = p.log.map(i=>`<li><i class="fa-solid fa-check"></i> ${i}</li>`).join('');
            document.getElementById('logsH').innerHTML = pr.log.map(i=>`<li><i class="fa-solid fa-check"></i> ${i}</li>`).join('');
        }
    </script>
</body>
</html>
